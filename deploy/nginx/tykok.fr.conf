# Portfolio vhost. Sits behind Traefik, which terminates TLS, so this listens
# on plain HTTP on the private network only.
#
# Install as /etc/nginx/sites-available/tykok.fr, then symlink into
# sites-enabled/ and reload.

# Cache policy is decided here rather than with per-location add_header, and that
# is deliberate: in nginx, a location that declares any add_header replaces the
# server-level set instead of extending it. Per-location Cache-Control therefore
# silently dropped every security header below. Keeping all add_header at server
# level and varying only the value makes that impossible.
#
# Vite fingerprints everything under /assets/, so only those are immutable.
# Everything else, index.html included, must revalidate — otherwise a deploy
# leaves visitors holding asset names that no longer exist.
map $uri $portfolio_cache_control {
    default                                 "no-cache, must-revalidate";
    ~^/assets/                              "public, max-age=31536000, immutable";
    ~*\.(?:ico|png|jpe?g|gif|svg|webp)$     "public, max-age=604800";
}

server {
    listen 80;
    listen [::]:80;

    server_name tykok.fr www.tykok.fr;

    # A symlink the deploy script swaps atomically. Nginx resolves it per
    # request, so a swap takes effect immediately without a reload.
    root /var/www/portfolio/current;
    index index.html;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log;

    # Trust the proxy for the client address. Restrict to Traefik's address.
    # set_real_ip_from 10.0.0.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- Headers, all in one place -------------------------------------------
    # No `always` here on purpose: with it, a 404 for a fingerprinted asset would
    # be returned as immutable for a year. Success responses only.
    add_header Cache-Control $portfolio_cache_control;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The app is fully self-contained: no external scripts, styles, fonts or
    # images. 'unsafe-inline' on style-src is required because the components
    # set inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- Routing --------------------------------------------------------------
    # Source maps are stripped before packaging; refuse them in case one slips.
    location ~* \.map$ {
        return 404;
    }

    # Dotfiles are never part of a build.
    location ~ /\. {
        return 404;
    }

    # Fingerprinted assets must exist; no falling back to the app shell.
    location /assets/ {
        try_files $uri =404;
    }

    # Single-page app: unknown paths render the app, which routes client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
