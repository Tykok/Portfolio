# Sert le build du portfolio. Derrière Traefik, qui termine le TLS.
#
# La politique de cache est décidée ici par un map, et non par des add_header
# dans chaque location : dans nginx, une location qui déclare un add_header
# remplace le jeu défini au niveau serveur au lieu de l'étendre. Un
# Cache-Control par location avait ainsi supprimé silencieusement les cinq
# en-têtes de sécurité ci-dessous. Garder tous les add_header au niveau serveur
# et ne faire varier que la valeur rend ce bug impossible.
#
# Vite empreinte tout ce qui est sous /assets/ : eux seuls sont immuables. Tout
# le reste, index.html compris, doit revalider — sinon un déploiement laisse des
# visiteurs avec des noms d'assets qui n'existent plus.
map $uri $portfolio_cache_control {
    default                                 "no-cache, must-revalidate";
    ~^/assets/                              "public, max-age=31536000, immutable";
    ~*\.(?:ico|png|jpe?g|gif|svg|webp)$     "public, max-age=604800";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # --- En-têtes, tous au même endroit --------------------------------------
    # Pas de `always` sur Cache-Control, volontairement : avec lui, un 404 sur un
    # asset empreinté serait renvoyé comme immuable pour un an.
    add_header Cache-Control $portfolio_cache_control;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # L'app est autonome : aucun script, style, police ou image externe.
    # 'unsafe-inline' sur style-src est requis, les composants posent des
    # attributs style en ligne.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- Routage --------------------------------------------------------------
    # Les source maps sont supprimées à la construction ; refusées ici au cas où.
    location ~* \.map$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # Un asset empreinté doit exister ; jamais de repli sur le shell.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
