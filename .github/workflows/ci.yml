name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version, shared with local dev.
          node-version-file: .nvmrc
          cache: npm

      # Fails on its own if package.json and package-lock.json disagree,
      # which is the lockfile-drift check we want anyway.
      - name: Install
        run: npm ci

      # Every check runs even when an earlier one failed, so a single run
      # reports the full picture instead of one failure at a time.
      - name: Format
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # Vitest's fork/thread pools occasionally hang on this suite's size
      # instead of failing — no error, no exit, until something external
      # kills the process (confirmed on both pools, on this runner and
      # locally: a real, intermittent Vitest/Node issue, not a broken test).
      # A per-attempt timeout turns that hang into a retry instead of
      # burning the whole job's budget.
      - name: Test
        if: ${{ !cancelled() }}
        run: |
          for attempt in 1 2 3; do
            if timeout 90s npm test; then
              exit 0
            fi
            echo "::warning::npm test attempt $attempt/3 failed or hung — retrying on a clean process"
            pkill -9 -f vitest || true
          done
          exit 1

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      # The repo is at 0 findings, so this gate is meaningful today. If a new
      # advisory ever lands on an unpatchable dev-only dependency, narrow it to
      # `npm audit --omit=dev --audit-level=high` rather than deleting it — that
      # still covers everything that reaches the browser.
      - name: Audit
        if: ${{ !cancelled() }}
        run: npm run audit
